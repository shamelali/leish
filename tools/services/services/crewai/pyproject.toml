[project]
name = "leish-crewai"
version = "0.1.0"
description = "CrewAI services for Leish marketplace"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.13.0",
    "pydantic",
]

[project.scripts]
leish-crew = "leish_crewai.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
